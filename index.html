<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MODCRAFT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: "Noto Sans KR", sans-serif; overflow: hidden; color: #e8edf5; }

    /* ── 랜딩 화면 ── */
    #landing {
      position: fixed; inset: 0; z-index: 1;
      display: flex; flex-direction: column;
    }
    .bg {
      position: absolute; inset: 0;
      background: url("https://i.imgur.com/KgaZTBO.jpg") center/cover no-repeat;
    }
    .bg-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.4), rgba(0,0,0,0.2) 40%, rgba(0,0,0,0.5));
    }
    header {
      position: relative; z-index: 2;
      padding: 20px 48px;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(0,0,0,0.35); backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .logo { font-family: "Syne", sans-serif; font-weight: 800; font-size: 1.3rem; letter-spacing: 0.14em; }
    .logo span { color: #7dd3fc; }
    .nav-tag {
      font-size: 0.68rem; letter-spacing: 0.12em; color: rgba(255,255,255,0.6);
      text-transform: uppercase; border: 1px solid rgba(255,255,255,0.2);
      padding: 5px 14px; border-radius: 100px;
    }
    .landing-body {
      position: relative; z-index: 2;
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; padding: 40px 24px;
    }
    h1 {
      font-family: "Syne", sans-serif; font-size: clamp(2.4rem, 6vw, 4.2rem);
      font-weight: 800; line-height: 1.1; letter-spacing: -0.02em;
      color: #fff; text-shadow: 0 2px 32px rgba(0,0,0,0.6); margin-bottom: 16px;
    }
    h1 em { font-style: normal; color: #7dd3fc; }
    .subtitle {
      font-size: 1rem; color: rgba(255,255,255,0.72); line-height: 1.7; font-weight: 300;
      max-width: 480px; margin: 0 auto 48px; text-shadow: 0 1px 8px rgba(0,0,0,0.5);
    }
    .btn-group { display: flex; gap: 32px; justify-content: center; flex-wrap: wrap; }
    .btn {
      position: relative; display: inline-block; cursor: pointer;
      border: none; background: none; padding: 0; outline: none;
      transition: transform 0.18s cubic-bezier(.16,1,.3,1), filter 0.18s;
      width: 222px; height: 54px;
    }
    .btn img { display: block; width: 100%; height: 100%; image-rendering: crisp-edges; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.6)); }
    .btn-label {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.92rem; font-weight: 500; letter-spacing: 0.06em;
      color: rgba(255,255,255,0.92); text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      pointer-events: none;
    }
    .btn:hover { transform: translateY(-3px) scale(1.03); filter: brightness(1.12); }
    .btn:active { transform: scale(0.97); }
    .btn-tooltip {
      position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.75); color: rgba(255,255,255,0.85);
      font-size: 0.68rem; letter-spacing: 0.03em; white-space: nowrap;
      padding: 5px 10px; border-radius: 6px; pointer-events: none;
      opacity: 0; transition: opacity 0.2s;
    }
    .btn:hover .btn-tooltip { opacity: 1; }
    footer {
      position: relative; z-index: 2;
      padding: 14px 48px; text-align: center;
      background: rgba(0,0,0,0.3); backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255,255,255,0.07);
      font-size: 0.7rem; color: rgba(255,255,255,0.35); letter-spacing: 0.06em;
    }

    /* ── 모달 (모드 만들기) ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.65); backdrop-filter: blur(10px);
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: rgba(10,15,25,0.92); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px; padding: 40px 36px; max-width: 440px; width: 90%; text-align: center;
      box-shadow: 0 24px 60px rgba(0,0,0,0.6);
    }
    .modal-icon { font-size: 2.2rem; margin-bottom: 14px; }
    .modal h2 { font-family: "Syne", sans-serif; font-size: 1.4rem; font-weight: 800; color: #fff; margin-bottom: 10px; }
    .modal p { color: rgba(255,255,255,0.55); font-size: 0.88rem; line-height: 1.6; margin-bottom: 26px; }
    .modal-close {
      padding: 11px 28px; border-radius: 10px;
      background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.8);
      border: 1px solid rgba(255,255,255,0.12);
      font-family: "Noto Sans KR", sans-serif; font-size: 0.88rem; cursor: pointer;
    }
    .modal-close:hover { background: rgba(255,255,255,0.18); }

    /* ── 탐색기 화면 ── */
    #explorer {
      position: fixed; inset: 0; z-index: 10;
      background: #1c1f26;
      display: none; flex-direction: column;
    }
    #explorer.show { display: flex; }

    .exp-header {
      display: flex; align-items: center; gap: 16px;
      padding: 16px 24px;
      background: #13151b;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      flex-shrink: 0;
    }
    .exp-back {
      display: flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.8); font-family: "Noto Sans KR", sans-serif;
      font-size: 0.82rem; padding: 7px 16px; border-radius: 8px;
      cursor: pointer; transition: background 0.15s; white-space: nowrap;
    }
    .exp-back:hover { background: rgba(255,255,255,0.13); }
    .exp-title {
      font-family: "Syne", sans-serif; font-size: 1rem; font-weight: 700;
      color: rgba(255,255,255,0.9); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .exp-root-name {
      font-size: 0.78rem; color: rgba(255,255,255,0.4);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .exp-body { display: flex; flex: 1; overflow: hidden; }

    /* 왼쪽 트리 패널 */
    .exp-tree {
      width: 300px; min-width: 200px; max-width: 400px;
      background: #181b22;
      border-right: 1px solid rgba(255,255,255,0.07);
      overflow-y: auto; padding: 12px 0;
      flex-shrink: 0;
    }
    .exp-tree::-webkit-scrollbar { width: 4px; }
    .exp-tree::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

    /* 트리 아이템 */
    .tree-item {
      display: flex; align-items: center;
      padding: 7px 16px; cursor: pointer;
      font-size: 0.84rem; color: rgba(255,255,255,0.75);
      transition: background 0.12s, color 0.12s;
      user-select: none; gap: 0;
    }
    .tree-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
    .tree-item.active { background: rgba(125,211,252,0.12); color: #7dd3fc; }
    .tree-item.file { cursor: default; }
    .tree-item.file:hover { background: rgba(255,255,255,0.03); color: rgba(255,255,255,0.6); }

    .tree-indent { display: inline-block; width: 18px; flex-shrink: 0; }
    .tree-icon { font-size: 0.8rem; margin-right: 7px; flex-shrink: 0; opacity: 0.7; }
    .tree-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tree-plus {
      font-size: 1rem; font-weight: 300; color: rgba(255,255,255,0.3);
      margin-left: 6px; flex-shrink: 0; transition: transform 0.2s, color 0.15s;
      line-height: 1;
    }
    .tree-item.open > .tree-plus { transform: rotate(45deg); color: #7dd3fc; }

    /* 자식 목록 */
    .tree-children { display: none; }
    .tree-children.open { display: block; }

    /* 오른쪽 안내 패널 */
    .exp-main {
      flex: 1; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 12px; color: rgba(255,255,255,0.2);
      font-size: 0.88rem; text-align: center; padding: 24px;
    }
    .exp-main-icon { font-size: 3rem; opacity: 0.3; }
  </style>
</head>

<!-- 숨겨진 폴더 선택 input -->
<input type="file" id="file-input" webkitdirectory multiple style="display:none" />

<!-- ── 탐색기 화면 ── -->
<div id="explorer">
  <div class="exp-header">
    <button class="exp-back" onclick="goBack()">← 돌아가기</button>
    <div>
      <div class="exp-title" id="exp-title">mod 폴더</div>
      <div class="exp-root-name" id="exp-root-name"></div>
    </div>
  </div>
  <div class="exp-body">
    <div class="exp-tree" id="exp-tree"></div>
    <div class="exp-main">
      <div class="exp-main-icon">📁</div>
      <div>왼쪽에서 폴더를 선택하세요</div>
    </div>
  </div>
</div>

<!-- 모드 만들기 모달 -->
<div class="modal-overlay" id="modal-create" onclick="closeOnOverlay(event,'modal-create')">
  <div class="modal">
    <div class="modal-icon">✨</div>
    <h2>모드 만들기</h2>
    <p>원하는 기능을 설명하면 모드 코드를 자동으로 생성해드립니다. 곧 서비스가 오픈됩니다!</p>
    <button class="modal-close" onclick="closeModal('modal-create')">닫기</button>
  </div>
</div>

<script>
  function openModal(t) { document.getElementById('modal-'+t).classList.add('open'); }
  function closeModal(id) { document.getElementById(id).classList.remove('open'); }
  function closeOnOverlay(e, id) { if (e.target === e.currentTarget) closeModal(id); }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') document.querySelectorAll('.modal-overlay.open').forEach(m => m.classList.remove('open'));
  });

  function triggerFileInput() {
    document.getElementById('file-input').click();
  }

  function goBack() {
    document.getElementById('explorer').classList.remove('show');
  }

  // 파일 선택 처리
  document.getElementById('file-input').addEventListener('change', function() {
    const files = Array.from(this.files);
    if (!files.length) return;

    // 트리 구조 빌드
    const tree = {};
    files.forEach(file => {
      const parts = file.webkitRelativePath.split('/');
      let node = tree;
      parts.forEach((part, i) => {
        if (i === parts.length - 1) {
          // 파일
          if (!node.__files__) node.__files__ = [];
          node.__files__.push(part);
        } else {
          // 폴더
          if (!node[part]) node[part] = {};
          node = node[part];
        }
      });
    });

    // 루트 폴더 이름
    const rootName = files[0].webkitRelativePath.split('/')[0];
    document.getElementById('exp-title').textContent = rootName;
    document.getElementById('exp-root-name').textContent = files.length + '개 항목';

    // 트리 렌더
    const treeEl = document.getElementById('exp-tree');
    treeEl.innerHTML = '';

    const rootNode = tree[rootName] || tree;
    renderTree(rootNode, treeEl, 0);

    // 탐색기 화면 전환
    document.getElementById('explorer').classList.add('show');
  });

  function renderTree(node, container, depth) {
    // 폴더 먼저
    const folders = Object.keys(node).filter(k => k !== '__files__');
    folders.sort((a,b) => a.localeCompare(b, 'ko'));

    folders.forEach(name => {
      const child = node[name];
      const hasChildren = Object.keys(child).filter(k => k !== '__files__').length > 0
                       || (child.__files__ && child.__files__.length > 0);

      // 래퍼
      const wrapper = document.createElement('div');

      // 아이템 행
      const item = document.createElement('div');
      item.className = 'tree-item';

      // 들여쓰기
      for (let i = 0; i < depth; i++) {
        const ind = document.createElement('span');
        ind.className = 'tree-indent';
        item.appendChild(ind);
      }

      // 아이콘
      const icon = document.createElement('span');
      icon.className = 'tree-icon';
      icon.textContent = '📁';
      item.appendChild(icon);

      // 이름
      const nameEl = document.createElement('span');
      nameEl.className = 'tree-name';
      nameEl.textContent = name;
      item.appendChild(nameEl);

      // + 기호 (자식 있을 때만)
      if (hasChildren) {
        const plus = document.createElement('span');
        plus.className = 'tree-plus';
        plus.textContent = '+';
        item.appendChild(plus);
      }

      // 자식 컨테이너
      const childContainer = document.createElement('div');
      childContainer.className = 'tree-children';

      item.addEventListener('click', () => {
        if (!hasChildren) return;
        const isOpen = item.classList.toggle('open');
        childContainer.classList.toggle('open', isOpen);
        icon.textContent = isOpen ? '📂' : '📁';

        // 자식이 아직 렌더 안됐으면 렌더
        if (isOpen && childContainer.childElementCount === 0) {
          renderTree(child, childContainer, depth + 1);
        }
      });

      wrapper.appendChild(item);
      wrapper.appendChild(childContainer);
      container.appendChild(wrapper);
    });

    // 파일
    if (node.__files__) {
      const filesSorted = [...node.__files__].sort((a,b) => a.localeCompare(b,'ko'));
      filesSorted.forEach(fname => {
        const item = document.createElement('div');
        item.className = 'tree-item file';

        for (let i = 0; i < depth; i++) {
          const ind = document.createElement('span');
          ind.className = 'tree-indent';
          item.appendChild(ind);
        }

        const icon = document.createElement('span');
        icon.className = 'tree-icon';
        // 확장자별 아이콘
        const ext = fname.split('.').pop().toLowerCase();
        const iconMap = { txt:'📄', lua:'📜', py:'🐍', js:'📜', json:'📋', png:'🖼️', jpg:'🖼️', dds:'🖼️', yml:'📋', xml:'📋', csv:'📊' };
        icon.textContent = iconMap[ext] || '📄';
        item.appendChild(icon);

        const nameEl = document.createElement('span');
        nameEl.className = 'tree-name';
        nameEl.textContent = fname;
        item.appendChild(nameEl);

        container.appendChild(item);
      });
    }
  }
</script>
</body>
</html>
